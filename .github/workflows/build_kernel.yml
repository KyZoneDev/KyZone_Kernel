name: Build Garnet OSS Kernel (KSU-Next v3.4.0 + SUSFS)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'URL Git Source Kernel Garnet'
        required: true
        default: 'https://github.com/Evolution-X-Devices/kernel_xiaomi_garnet.git'
      kernel_branch:
        description: 'Branch Kernel'
        required: true
        default: 'bka'
      defconfig_name:
        description: 'Target Defconfig'
        required: true
        default: 'gki_defconfig'
      use_dev_susfs_branch:
        description: 'Gunakan branch pre-patched dev-susfs KSU-Next? (true/false)'
        required: true
        default: 'false'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maksimalkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Instal Dependensi Build Kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 cpio pahole dwarves zstd

      - name: Clone Source Kernel Garnet
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} \
            ${{ github.event.inputs.kernel_repo }} kernel_garnet

      - name: Unduh Toolchain Clang (AOSP LLVM)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r510928.git clang./clang/bin/clang --version
       

      - name: Integrasi KernelSU Next v3.4.0 & SUSFS
        working-directory: ${{ github.workspace }}/kernel_garnet
        run: |
          # 1. Clone repo SUSFS untuk GKI Android 12 - Kernel 5.10 & Fix Patches
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git .susfs
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git .kp

          # 2. Salin file source & header SUSFS ke pohon kernel
          cp -rf .susfs/kernel_patches/fs/* ./fs/
          cp -rf .susfs/kernel_patches/include/linux/* ./include/linux/

          # 3. Terapkan patch SUSFS ke kernel 5.10
          patch -p1 --fuzz=3 < .susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          # 4. Pasang KernelSU Next v3.4.0 (atau branch dev-susfs)
          if [ "${{ github.event.inputs.use_dev_susfs_branch }}" = "true" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          else
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.4.0
            
            # Terapkan patch kompatibilitas SUSFS pada folder KernelSU-Next
            SUS_VER=$(grep -E '^#define SUSFS_VERSION' .susfs/kernel_patches/include/linux/susfs.h | cut -d' ' -f3 | sed 's/"//g')
            cd KernelSU-Next || cd KernelSU
            if [ -d "../.kp/next/susfs_fix_patches/${SUS_VER}" ]; then
              for p in ../.kp/next/susfs_fix_patches/${SUS_VER}/*.patch; do
                patch -p1 --fuzz=3 < "$p" || true
              done
            else
              patch -p1 --fuzz=3 < ../.susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
            fi
          fi

      - name: Injeksi Flag Defconfig (KSU Next & SUSFS)
        working-directory: ${{ github.workspace }}/kernel_garnet
        run: |
          DEFCONFIG_FILE="arch/arm64/configs/${{ github.event.inputs.defconfig_name }}"
          
          # Jika tree menggunakan fragment vendor/garnet_GKI.config atau parrot_GKI.config, tambahkan juga
          cat << 'EOF' >> "$DEFCONFIG_FILE"
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: Kompilasi Kernel
        working-directory: ${{ github.workspace }}/kernel_garnet
        run: |
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ github.event.inputs.defconfig_name }}

          # Verifikasi apakah CONFIG_KSU dan CONFIG_KSU_SUSFS aktif di .config
          grep "CONFIG_KSU=" out/.config
          grep "CONFIG_KSU_SUSFS=" out/.config

          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Bungkus dengan AnyKernel3
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          # Sesuaikan anykernel.sh untuk Redmi Note 13 Pro 5G / Poco X6 5G (garnet)
          sed -i 's/device.name1=.*/device.name1=garnet/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=parrot/g' AnyKernel3/anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/g' AnyKernel3/anykernel.sh

          if [ -f "kernel_garnet/out/arch/arm64/boot/Image" ]; then
            cp kernel_garnet/out/arch/arm64/boot/Image AnyKernel3/
          elif [ -f "kernel_garnet/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel_garnet/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            echo "Image kernel tidak ditemukan!"
            exit 1
          fi

          cd AnyKernel3
          zip -r9 "../Garnet-OSS-KSUNext-v3.4.0-SUSFS-$(date +%Y%m%d).zip" * -x .gitignore README.md

      - name: Unggah Hasil Build ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Garnet-Kernel-KSUNext-v3.4.0-SUSFS
          path: ${{ github.workspace }}/*.zip
