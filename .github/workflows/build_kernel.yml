name: Build Garnet OSS Kernel (KSU-Next v3.4.0 + SUSFS)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'URL Git Source Kernel Garnet'
        required: true
        default: 'https://github.com/Evolution-X-Devices/kernel_xiaomi_garnet.git'
      kernel_branch:
        description: 'Branch Kernel'
        required: true
        default: 'bka'
      defconfig_name:
        description: 'Target Defconfig'
        required: true
        default: 'gki_defconfig'
      use_dev_susfs_branch:
        description: 'Gunakan branch dev-susfs KSU-Next? (true/false)'
        required: true
        default: 'false'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maksimalkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Instal Dependensi Build Kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 cpio pahole dwarves zstd

      - name: Clone Source Kernel Garnet
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} \
            ${{ github.event.inputs.kernel_repo }} kernel_garnet

      - name: Unduh Toolchain Clang (AOSP LLVM)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r510928.git clang
          ./clang/bin/clang --version

      - name: Integrasi KernelSU Next v3.4.0 & SUSFS
        working-directory: ${{ github.workspace }}/kernel_garnet
        run: |
          # 1. Clone repo SUSFS untuk GKI Android 12 - Kernel 5.10 & Fix Patches
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git .susfs
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git .kp

          # 2. Salin file source & header SUSFS ke pohon kernel
          cp -rf .susfs/kernel_patches/fs/* ./fs/
          cp -rf .susfs/kernel_patches/include/linux/* ./include/linux/

          # 3. Terapkan patch SUSFS ke kernel 5.10
          patch -p1 --fuzz=3 < .susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          # 4. Pasang KernelSU Next & Patch SUSFS
          if [ "${{ github.event.inputs.use_dev_susfs_branch }}" = "true" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev-susfs || \
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs
          else
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.4.0
            
            SUS_VER=$(grep -E '^#define SUSFS_VERSION' .susfs/kernel_patches/include/linux/susfs.h | cut -d' ' -f3 | sed 's/"//g')
            cd KernelSU-Next || cd KernelSU
            
            # Terapkan patch utama SUSFS terlebih dahulu, lalu diikuti fix patch
            patch -p1 --fuzz=3 -N < ../.susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
            if [ -d "../.kp/next/susfs_fix_patches/${SUS_VER}" ]; then
              for p in ../.kp/next/susfs_fix_patches/${SUS_VER}/*.patch; do
                patch -p1 --fuzz=3 -N < "$p" || true
              done
            fi
          fi

          # 5. Pastikan definisi KSU_SUSFS terdaftar di Kconfig KernelSU-Next agar tidak dihapus saat make defconfig
          cd "${{ github.workspace }}/kernel_garnet"
          KSU_KCONFIG=$(find KernelSU* drivers/kernelsu -maxdepth 2 -name "Kconfig" | head -n 1)
          if ! grep -q "config KSU_SUSFS" "$KSU_KCONFIG"; then
            sed -i '/endmenu/d' "$KSU_KCONFIG"
            cat << 'EOF' >> "$KSU_KCONFIG"

          config KSU_SUSFS
              bool "KernelSU addon - SUSFS"
              depends on KSU
              default y

          config KSU_SUSFS_HAS_MAGIC_MOUNT
              bool "Enable SUSFS Magic Mount"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_PATH
              bool "Enable to hide suspicious path"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_MOUNT
              bool "Enable to hide suspicious mounts"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
              bool "Enable to hide KSU's default mounts automatically"
              depends on KSU_SUSFS_SUS_MOUNT
              default y

          config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
              bool "Enable to hide suspicious bind mounts automatically"
              depends on KSU_SUSFS_SUS_MOUNT
              default y

          config KSU_SUSFS_SUS_KSTAT
              bool "Enable to spoof suspicious kstat"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_OVERLAYFS
              bool "Enable to spoof suspicious overlayfs"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_TRY_UMOUNT
              bool "Enable to use ksu's try_umount"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
              bool "Enable to add bind mounts to ksu's try_umount automatically"
              depends on KSU_SUSFS_TRY_UMOUNT
              default y

          config KSU_SUSFS_SPOOF_UNAME
              bool "Enable to spoof uname"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_ENABLE_LOG
              bool "Enable logging susfs messages"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
              bool "Enable to automatically hide ksu and susfs symbols from /proc/kallsyms"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
              bool "Enable to spoof /proc/bootconfig or /proc/cmdline"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_OPEN_REDIRECT
              bool "Enable to redirect a path to be opened with another path"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_SU
              bool "Enable SUS-SU in runtime temporarily"
              depends on KSU_SUSFS && KPROBES && HAVE_KPROBES && KPROBE_EVENTS
              default n

          endmenu
          EOF
          fi

      - name: Injeksi Flag Defconfig (KSU Next & SUSFS)
        working-directory: ${{ github.workspace }}/kernel_garnet
        run: |
          DEFCONFIG_FILE="arch/arm64/configs/${{ github.event.inputs.defconfig_name }}"
          cat << 'EOF' >> "$DEFCONFIG_FILE"
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: Kompilasi Kernel
        working-directory: ${{ github.workspace }}/kernel_garnet   
        run: |
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="KyZone"
          export KBUILD_BUILD_HOST="GitHubActions"

          # 1. Perbaiki langsung unused label 'skip' di fs/proc/bootconfig.c
          if [ -f "fs/proc/bootconfig.c" ]; then
            sed -i 's/skip:;/skip: __attribute__((unused));/g' fs/proc/bootconfig.c
          fi

          # 2. Hapus paksa flag -Werror dari Makefile utama & sub-Makefile agar Clang tidak rewel
          sed -i 's/-Werror/-Wno-error/g' Makefile
          find . -type f -name "Makefile*" -exec sed -i 's/-Werror/-Wno-error/g' {} +

          # 3. Buat file out/.config awal
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ github.event.inputs.defconfig_name }}

          # 4. Matikan CONFIG_WERROR di .config
          ./scripts/config --file out/.config -d WERROR
          ./scripts/config --file out/.config -d CONFIG_WERROR
          ./scripts/config --file out/.config -d CC_WERROR

          echo "=== Status Konfigurasi KSU & SUSFS ==="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS" out/.config || true

          # 5. Jalankan kompilasi penuh dengan flag -Wno-unused-label dan -Wno-error
          set +e
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -Wno-unused-label -Wno-unused-variable -Wno-unused-function" 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          # 6. Jika masih ada gagal, tampilkan ringkasan penyebab error di bagian paling bawah
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=========================================="
            echo "RINGKASAN PENYEBAB ERROR KOMPILASI:"
            echo "=========================================="
            grep -En "error:|fatal error:|undefined reference" build.log || tail -n 50 build.log
            exit $BUILD_STATUS
          fi

      - name: Bungkus dengan AnyKernel3
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          sed -i 's/device.name1=.*/device.name1=garnet/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=parrot/g' AnyKernel3/anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/g' AnyKernel3/anykernel.sh

          if [ -f "kernel_garnet/out/arch/arm64/boot/Image" ]; then
            cp kernel_garnet/out/arch/arm64/boot/Image AnyKernel3/
          elif [ -f "kernel_garnet/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel_garnet/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            echo "Image kernel tidak ditemukan!"
            exit 1
          fi

          cd AnyKernel3
          zip -r9 "../KyZone-Garnet-KSUNext-v3.4.0-SUSFS-$(date +%Y%m%d).zip" * -x .gitignore README.md

      - name: Unggah Hasil Build ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KyZone-Garnet-KSUNext-v3.4.0-SUSFS
          path: ${{ github.workspace }}/*.zip
