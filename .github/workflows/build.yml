name: Build OSS Kernel Garnet (SM7435) with KSU-Next & SUSFS

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: 'Integrasikan KernelSU-Next & SUSFS? (true/false)'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Kosongkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install Dependensi Build
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 \
            dwarves pahole cpio

      - name: Checkout Source Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      - name: Setup Toolchain (Clang)
        run: |
          mkdir -p clang
          CLANG_URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
          echo "Mengunduh Clang dari: $CLANG_URL"
          curl -LSs "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Integrasi KernelSU-Next & SUSFS (5.10 GKI)
        if: ${{ github.event.inputs.ksu == 'true' }}
        working-directory: kernel
        run: |
          # 1. Bersihkan sisa KernelSU lama jika ada
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true

          # 2. Pasang KernelSU-Next menggunakan branch pre-patched susfs agar aman dari konflik
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh" | bash -s dev

          # 3. Clone repo SUSFS khusus GKI Android 12 (5.10)
          rm -rf susfs4ksu
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu

          # 4. Salin file utama SUSFS ke dalam folder fs/ dan include/linux/
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/

          # 5. Terapkan patch SUSFS ke kernel
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch .
          patch -p1 -N --no-backup-if-mismatch < 50_add_susfs_in_gki-android12-5.10.patch || true

      - name: Compile Kernel
        working-directory: kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Builder"
          export KBUILD_BUILD_HOST="GitHubActions"

          # Gabungkan defconfig dasar garnet
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            gki_defconfig \
            vendor/parrot_GKI.config \
            vendor/garnet_GKI.config

          # Aktifkan konfigurasi KSU dan SUSFS jika diaktifkan
          if [ "${{ github.event.inputs.ksu }}" = "true" ]; then
            ./scripts/config --file out/.config \
              -e KSU \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SUS_OVERLAYFS \
              -e KSU_SUSFS_TRY_UMOUNT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_SU
          fi

          # Sinkronisasi konfigurasi lama ke baru
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          # Proses kompilasi Image kernel
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image

      - name: Kemas dengan AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=garnet/g' AnyKernel3/anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot;/g' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/g' AnyKernel3/anykernel.sh
          
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Garnet-KSU-SUSFS-Kernel-$(date +%Y%m%d).zip * -x .git README.md *placeholder

      - name: Upload Hasil Build (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Garnet-KSU-SUSFS-Kernel
          path: Garnet-KSU-SUSFS-Kernel-*.zip
